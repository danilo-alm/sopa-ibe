name: sopa-ibe-dev

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: file:./data/dev.db
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-em-desenvolvimento}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ibegerais.org.br}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./data:/app/prisma/data
      - ./uploads:/app/uploads
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  backend_node_modules:
  frontend_node_modules:
